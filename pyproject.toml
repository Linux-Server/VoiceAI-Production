[project]
name = "llm-compress"
version = "0.1.0"
description = "Compress LLMs with llm-compressor on Modal GPUs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llmcompressor==0.14.0",
    "modal>=1.6.1",
    "openai>=3.29.0",
]

[dependency-groups]
dev = [
    "httpx[http2]>=0.28.1",
    "lm-eval[api,ifeval]>=0.4.13",
]
